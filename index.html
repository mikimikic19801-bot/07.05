<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bet Algo: Odds Elite</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(26, 31, 44, 0.8);
            --accent: #00d2ff;
            --drop: #ff4757;
            --win: #2ed573;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1f2c 0%, #050505 100%);
            color: var(--text);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .app-container { width: 100%; max-width: 400px; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { 
            font-size: 22px; color: var(--accent); 
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            margin: 0;
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(15px);
            border-radius: 28px; padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            transition: 0.3s ease;
        }

        .section-label {
            font-size: 10px; color: #888;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 15px; display: block; font-weight: bold;
        }

        .odds-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        
        .input-group { display: flex; flex-direction: column; text-align: center; }
        .input-group label { font-size: 11px; margin-bottom: 6px; color: #555; font-weight: 900; }
        
        input {
            background: rgba(0,0,0,0.5); border: 1px solid #333;
            border-radius: 14px; padding: 14px 5px; color: white;
            font-size: 18px; font-weight: 900; outline: none; text-align: center;
            transition: 0.3s; width: 100%; box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); background: #000; }

        .result-display {
            text-align: center; padding: 20px;
        }
        .drop-val { 
            font-size: 48px; font-weight: 900; color: var(--drop);
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
            margin: 10px 0;
        }

        .footer-stats {
            background: #fff; border-radius: 0 0 28px 28px;
            margin: 10px -20px -20px -20px; padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
            color: #000;
        }
        .margin-label { font-weight: 900; font-size: 12px; text-transform: uppercase; }
        .margin-val { font-size: 20px; font-weight: 900; color: var(--win); }

        /* Status bar simulacija */
        .status-badge {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent);
            padding: 5px 12px; border-radius: 20px;
            font-size: 10px; font-weight: bold; margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>BET ALGO <span style="font-weight: 100;">ELITE</span></h1>
    </header>

    <div class="glass-card">
        <span class="section-label">Početne kvote (Starting)</span>
        <div class="odds-grid">
            <div class="input-group"><label>1</label><input type="number" id="o1" value="2.10" step="0.01" oninput="calc()"></div>
            <div class="input-group"><label>X</label><input type="number" id="oX" value="3.40" step="0.01" oninput="calc()"></div>
            <div class="input-group"><label>2</label><input type="number" id="o2" value="3.50" step="0.01" oninput="calc()"></div>
        </div>
    </div>

    <div class="glass-card" style="border: 1px solid rgba(0, 210, 255, 0.3);">
        <span class="section-label" style="color: var(--accent);">Trenutne kvote (Live)</span>
        <div class="odds-grid">
            <div class="input-group"><label>1</label><input type="number" id="n1" value="1.85" step="0.01" oninput="calc()"></div>
            <div class="input-group"><label>X</label><input type="number" id="nX" value="3.30" step="0.01" oninput="calc()"></div>
            <div class="input-group"><label>2</label><input type="number" id="n2" value="4.20" step="0.01" oninput="calc()"></div>
        </div>
    </div>

    <div class="glass-card">
        <div class="result-display">
            <span class="status-badge" id="statusText">PRIMEĆEN PAD KVOTE</span>
            <div class="section-label">Procenat Pada</div>
            <div id="dropResult" class="drop-val">11.9% ↓</div>
        </div>

        <div class="footer-stats">
            <div class="margin-label">Marža Kladionice:</div>
            <div id="newMargin" class="margin-val">4.85%</div>
        </div>
    </div>
</div>

<script>
    function calc() {
        const o1 = parseFloat(document.getElementById('o1').value) || 0;
        const oX = parseFloat(document.getElementById('oX').value) || 0;
        const o2 = parseFloat(document.getElementById('o2').value) || 0;

        const n1 = parseFloat(document.getElementById('n1').value) || 0;
        const nX = parseFloat(document.getElementById('nX').value) || 0;
        const n2 = parseFloat(document.getElementById('n2').value) || 0;

        // Marža
        const margin = ((1/n1 + 1/nX + 1/n2) - 1) * 100;
        document.getElementById('newMargin').innerText = margin.toFixed(2) + "%";

        // Padovi
        const d1 = ((o1 - n1) / o1) * 100;
        const dX = ((oX - nX) / oX) * 100;
        const d2 = ((o2 - n2) / o2) * 100;
        const maxDrop = Math.max(d1, dX, d2);

        const dropEl = document.getElementById('dropResult');
        const statusEl = document.getElementById('statusText');
        
        dropEl.innerText = maxDrop.toFixed(1) + "% " + (maxDrop > 0 ? "↓" : "↑");
        
        if(maxDrop > 10) {
            dropEl.style.color = "var(--drop)";
            statusEl.innerText = "ALARM: MASIVAN PAD";
            statusEl.style.background = "rgba(255, 71, 87, 0.1)";
            statusEl.style.color = "var(--drop)";
        } else {
            dropEl.style.color = "var(--accent)";
            statusEl.innerText = "STABILNE KVOTE";
            statusEl.style.background = "rgba(0, 210, 255, 0.1)";
            statusEl.style.color = "var(--accent)";
        }
    }
    calc();

    // Register Service Worker za rad bez interneta
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
