<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kvota</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

  <div class="bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-lg">
    <h1 class="text-3xl font-bold text-center mb-6">🎲 Kalkulator Kvota</h1>

    <div class="grid grid-cols-2 gap-6">
      <div>
        <h3 class="text-lg font-semibold mb-2">Stare kvote</h3>
        <input id="stara1" type="number" step="0.01" class="w-full p-2 mb-2 rounded bg-gray-700 text-white" placeholder="Stara kvota 1">
        <input id="stara2" type="number" step="0.01" class="w-full p-2 mb-2 rounded bg-gray-700 text-white" placeholder="Stara kvota 2">
        <input id="stara3" type="number" step="0.01" class="w-full p-2 mb-2 rounded bg-gray-700 text-white" placeholder="Stara kvota 3">
      </div>
      <div>
        <h3 class="text-lg font-semibold mb-2">Nove kvote</h3>
        <input id="nova1" type="number" step="0.01" class="w-full p-2 mb-2 rounded bg-gray-700 text-white" placeholder="Nova kvota 1">
        <input id="nova2" type="number" step="0.01" class="w-full p-2 mb-2 rounded bg-gray-700 text-white" placeholder="Nova kvota 2">
        <input id="nova3" type="number" step="0.01" class="w-full p-2 mb-2 rounded bg-gray-700 text-white" placeholder="Nova kvota 3">
      </div>
    </div>

    <button onclick="izracunaj()" class="w-full mt-6 py-3 bg-blue-500 hover:bg-blue-600 rounded-lg text-lg font-bold transition">Izračunaj</button>

    <div id="rezultat" class="mt-6 text-center text-xl font-semibold"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
